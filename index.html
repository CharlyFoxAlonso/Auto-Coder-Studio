<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 32px;
            width: 100%;
            max-width: 460px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background-color: #9ca3af;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.15s ease;
        }

        .tab-btn:hover {
            filter: brightness(0.95);
        }

        .tab-btn.active {
            background-color: #1e3a8a;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .field {
            margin-bottom: 16px;
        }

        .input,
        .output {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 16px 18px;
            font-size: 18px;
            color: #111827;
        }

        .input:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .output {
            background-color: #f9fafb;
            color: #4b5563;
        }

        .api-status {
            margin-top: 12px;
            font-size: 13px;
            color: #6b7280;
            text-align: center;
        }

        .api-status.error {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" data-tab="dolar">Dólar Tarjeta</button>
            <button class="tab-btn" data-tab="importacion">Importación</button>
        </div>

        <div class="tab-panel active" id="panel-dolar">
            <div class="field">
                <input type="number" class="input" id="usd-input" placeholder="Ingresá el monto en USD">
            </div>
            <div class="field">
                <div class="output" id="ars-output">Total a pagar en ARS</div>
            </div>
            <div class="api-status" id="status-dolar">Cargando dólar tarjeta...</div>
        </div>

        <div class="tab-panel" id="panel-importacion">
            <div class="field">
                <input type="number" class="input" id="ars-input" placeholder="Ingresá el precio en ARS (ej: Temu)">
            </div>
            <div class="field">
                <div class="output" id="base-output">Precio base real en ARS</div>
            </div>
            <div class="api-status">Factor de importación aplicado: x1.35</div>
        </div>
    </div>

    <script>
        (function () {
            // Formateador ARS: "$ 15.000,00"
            const fmtARS = new Intl.NumberFormat('es-AR', {
                style: 'currency',
                currency: 'ARS',
                maximumFractionDigits: 2
            });

            // Variable global con el valor del dólar tarjeta
            let dolarTarjeta = 1500;
            const apiOk = { dolarTarjeta: false };

            // Traemos el dólar al cargar la página
            fetch('https://dolarapi.com/v1/dolares/tarjeta')
                .then(function (resp) {
                    if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
                    return resp.json();
                })
                .then(function (data) {
                    if (data && typeof data.venta === 'number') {
                        dolarTarjeta = data.venta;
                        apiOk.dolarTarjeta = true;
                        const status = document.getElementById('status-dolar');
                        if (status) {
                            status.textContent =
                                'Dólar tarjeta: ' + fmtARS.format(dolarTarjeta) +
                                ' (actualizado)';
                        }
                    }
                })
                .catch(function (err) {
                    // Falló la API: dejamos el valor por defecto (1500)
                    dolarTarjeta = 1500;
                    apiOk.dolarTarjeta = false;
                    const status = document.getElementById('status-dolar');
                    if (status) {
                        status.classList.add('error');
                        status.textContent =
                            '⚠️ No se pudo obtener el dólar tarjeta (' +
                            (err && err.message ? err.message : 'error') +
                            '). Usando valor por defecto: ' +
                            fmtARS.format(1500);
                    }
                    console.warn('Fallo dolarapi:', err);
                });

            // Cambio de pestañas
            const tabs = document.querySelectorAll('.tab-btn');
            const panels = document.querySelectorAll('.tab-panel');
            tabs.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    tabs.forEach(function (b) { b.classList.remove('active'); });
                    panels.forEach(function (p) { p.classList.remove('active'); });
                    btn.classList.add('active');
                    const target = btn.getAttribute('data-tab');
                    const panel = document.getElementById('panel-' + target);
                    if (panel) { panel.classList.add('active'); }
                });
            });

            // Pestaña 1: USD -> ARS (multiplica por el dólar tarjeta)
            const usdInput = document.getElementById('usd-input');
            const arsOutput = document.getElementById('ars-output');
            usdInput.addEventListener('input', function () {
                const usd = parseFloat(usdInput.value);
                if (isNaN(usd) || usd <= 0) {
                    arsOutput.textContent = 'Total a pagar en ARS';
                    return;
                }
                const total = usd * dolarTarjeta;
                arsOutput.textContent = fmtARS.format(total);
            });

            // Pestaña 2: ARS con impuestos x1.35 -> precio base
            const arsInput = document.getElementById('ars-input');
            const baseOutput = document.getElementById('base-output');
            arsInput.addEventListener('input', function () {
                const ars = parseFloat(arsInput.value);
                if (isNaN(ars) || ars <= 0) {
                    baseOutput.textContent = 'Precio base real en ARS';
                    return;
                }
                const base = ars / 1.35;
                baseOutput.textContent = fmtARS.format(base);
            });
        })();
    </script>
</body>
</html>
